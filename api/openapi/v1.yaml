openapi: 3.0.3
info:
  title: Quota API Gateway
  version: v1
  description: |
    Regional capacity reservations with idempotent creates. Use header **X-Customer-ID: demo** in compose
    for seeded quotas and product **vm**. Problem `type` values are documented at **GET /v1/problems**.

    **JSON numbers:** Integer fields (`amount`, quota counters, TTLs, etc.) are JSON **numbers**, not strings.
    The gateway maps gRPC/protobuf into OpenAPI-shaped JSON (`encoding/json`); it does **not** use protobuf’s
    JSON mapping (which quotes `int64` for JavaScript safety). See [design.md](../docs/design.md#rest-json-vs-grpc).

tags:
  - name: Meta
    description: Discovery, regions, and problem catalog
  - name: Catalog
    description: Products and resource constraints
  - name: Capacity
    description: Services, quota, and availability
  - name: Fan-out
    description: Multi-region aggregated reads

paths:
  /v1/problems:
    get:
      operationId: listProblems
      tags: [Meta]
      summary: List problem types
      description: Catalog of RFC 9457 problem types returned by this API (`type` is a relative URI).
      responses:
        "200":
          description: Problem catalog
          content:
            application/json:
              schema:
                type: object
                required: [problems]
                properties:
                  problems:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProblemTypeDoc"
  /v1/problems/{slug}:
    get:
      operationId: getProblem
      tags: [Meta]
      summary: Describe one problem type
      description: Returns title, HTTP status, and human-readable description for errors with this problem slug.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Problem type metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemTypeDoc"
        "404":
          $ref: "#/components/responses/ProblemNotFound"
  /v1/regions:
    get:
      operationId: listRegions
      tags: [Meta]
      summary: Region health and breaker status
      description: One row per configured region (`available`, `degraded`, or `unavailable`).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegionsResponse"
  /v1/products:
    get:
      operationId: fanoutProducts
      tags: [Catalog, Fan-out]
      summary: Product catalog (all regions)
      description: Same catalog per region; fan-out for partial region failures.
      parameters:
        - $ref: "#/components/parameters/CustomerID"
      responses:
        "200":
          description: Fan-out product catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FanoutProductsResponse"
        "401":
          $ref: "#/components/responses/MissingCustomer"
  /v1/regions/{region}/products:
    get:
      operationId: listRegionProducts
      tags: [Catalog]
      summary: Product catalog for one region
      description: Products you may pass as `product` on create (e.g. **vm**) with resource constraints and TTL bounds.
      parameters:
        - $ref: "#/components/parameters/Region"
        - $ref: "#/components/parameters/CustomerID"
      responses:
        "200":
          description: Product catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListProductsResponse"
  /v1/regions/{region}/services:
    post:
      operationId: createService
      tags: [Capacity]
      summary: Create service reservation
      description: |
        Atomically reserves capacity. **Idempotency-Key** must be generated by the client (e.g. UUID)
        and reused on retries so the server can replay the same outcome; the server stores keys but does
        not assign them.
      parameters:
        - $ref: "#/components/parameters/Region"
        - $ref: "#/components/parameters/CustomerID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceRequest"
      responses:
        "201":
          description: Created (or idempotent replay)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceResponse"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
    get:
      operationId: listRegionServices
      tags: [Capacity]
      summary: List services in region
      description: All services for the customer in this region.
      parameters:
        - $ref: "#/components/parameters/Region"
        - $ref: "#/components/parameters/CustomerID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListServicesResponse"
  /v1/regions/{region}/services/{id}:
    get:
      operationId: getService
      tags: [Capacity]
      summary: Get one service
      description: Fetch a single service by id in the given region.
      parameters:
        - $ref: "#/components/parameters/Region"
        - $ref: "#/components/parameters/CustomerID"
        - $ref: "#/components/parameters/ServiceID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceResponse"
    patch:
      operationId: confirmService
      tags: [Capacity]
      summary: Confirm reservation (reserved → active)
      description: Idempotent when the service is already active.
      parameters:
        - $ref: "#/components/parameters/Region"
        - $ref: "#/components/parameters/CustomerID"
        - $ref: "#/components/parameters/ServiceID"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                state:
                  type: string
                  enum: [active]
      responses:
        "200":
          description: OK (idempotent if already active)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceResponse"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: cancelService
      tags: [Capacity]
      summary: Cancel reservation
      description: Idempotent when the reservation is already cancelled.
      parameters:
        - $ref: "#/components/parameters/Region"
        - $ref: "#/components/parameters/CustomerID"
        - $ref: "#/components/parameters/ServiceID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceResponse"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/regions/{region}/services/{id}/events:
    get:
      operationId: listServiceEvents
      tags: [Capacity]
      summary: Service state history
      description: Audit trail of lifecycle events for a service.
      parameters:
        - $ref: "#/components/parameters/Region"
        - $ref: "#/components/parameters/CustomerID"
        - $ref: "#/components/parameters/ServiceID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListServiceEventsResponse"
  /v1/regions/{region}/availability:
    get:
      operationId: getRegionAvailability
      tags: [Capacity]
      summary: Advisory availability in region
      description: Remaining pool and quota per resource; create is the guarantee.
      parameters:
        - $ref: "#/components/parameters/Region"
        - $ref: "#/components/parameters/CustomerID"
        - name: product
          in: query
          required: false
          schema:
            type: string
          description: Limit entries to resources for this product (e.g. vm)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityResponse"
  /v1/regions/{region}/quota:
    get:
      operationId: getRegionQuota
      tags: [Capacity]
      summary: Customer quota usage in region
      description: |
        Per-resource limits and usage. **provisioned** is false when no quota row exists for the customer
        (compose seeds **demo** only). Use **GET .../products** for allowed products.
      parameters:
        - $ref: "#/components/parameters/Region"
        - $ref: "#/components/parameters/CustomerID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotaResponse"
  /v1/availability:
    get:
      operationId: fanoutAvailability
      tags: [Capacity, Fan-out]
      summary: Fan-out availability
      description: Parallel per-region availability with partial results when a region is down.
      parameters:
        - $ref: "#/components/parameters/CustomerID"
        - name: product
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Fan-out availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FanoutAvailabilityResponse"
  /v1/quotas:
    get:
      operationId: fanoutQuotas
      tags: [Capacity, Fan-out]
      summary: Fan-out quotas
      description: Parallel per-region quota rows for the customer.
      parameters:
        - $ref: "#/components/parameters/CustomerID"
      responses:
        "200":
          description: Fan-out quotas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FanoutQuotaResponse"
  /v1/services:
    get:
      operationId: fanoutServices
      tags: [Capacity, Fan-out]
      summary: Fan-out services
      description: Parallel per-region service lists for the customer.
      parameters:
        - $ref: "#/components/parameters/CustomerID"
      responses:
        "200":
          description: Fan-out services
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FanoutServicesResponse"

components:
  parameters:
    Region:
      name: region
      in: path
      required: true
      schema:
        type: string
      example: ir-thr-1
    CustomerID:
      name: X-Customer-ID
      in: header
      required: true
      schema:
        type: string
      description: Tenant identity. Compose seeds quotas for **demo**.
      example: demo
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
      description: Client-generated unique key (UUID recommended); reuse on retry for the same logical create.
    ServiceID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    MissingCustomer:
      description: Missing X-Customer-ID
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ValidationError:
      description: Validation error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Conflict (quota, capacity, state, idempotency)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ProblemNotFound:
      description: Unknown problem slug
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    ProblemTypeDoc:
      type: object
      properties:
        slug:
          type: string
        type:
          type: string
          example: /v1/problems/validation-error
        title:
          type: string
        status:
          type: integer
        description:
          type: string
    Problem:
      type: object
      properties:
        type:
          type: string
          description: Relative URI under /v1/problems/{slug}
          example: /v1/problems/validation-error
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        region:
          type: string
    CreateServiceRequest:
      type: object
      required: [product, items]
      properties:
        product:
          type: string
          description: Product name from GET .../products (e.g. vm)
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ResourceItemInput"
        ttl_seconds:
          type: integer
          format: int64
          description: Omitted uses product default; 0 creates active immediately
    ResourceItemInput:
      type: object
      required: [resource, amount]
      properties:
        resource:
          type: string
          description: Resource name (cpu, ram, disk, public_ip for vm)
        amount:
          type: integer
          format: int64
    ResourceItem:
      allOf:
        - $ref: "#/components/schemas/ResourceItemInput"
        - type: object
          properties:
            unit:
              type: string
              readOnly: true
              description: Display unit from catalog (cores, GiB, …); do not send on create
    Service:
      type: object
      properties:
        id:
          type: string
        customer_id:
          type: string
        product:
          type: string
        state:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/ResourceItem"
        expires_at_unix:
          type: integer
          format: int64
        created_at:
          type: string
        updated_at:
          type: string
    ServiceResponse:
      type: object
      properties:
        service:
          $ref: "#/components/schemas/Service"
    ListServicesResponse:
      type: object
      properties:
        services:
          type: array
          items:
            $ref: "#/components/schemas/Service"
    ListServiceEventsResponse:
      type: object
      properties:
        events:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              event_type:
                type: string
              at:
                type: string
    AvailabilityEntry:
      type: object
      properties:
        resource:
          type: string
        unit:
          type: string
        pool_remaining:
          type: integer
          format: int64
        quota_remaining:
          type: integer
          format: int64
    AvailabilityResponse:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AvailabilityEntry"
    QuotaEntry:
      type: object
      properties:
        resource:
          type: string
        unit:
          type: string
        limit:
          type: integer
          format: int64
          nullable: true
        allocated:
          type: integer
          format: int64
        reserved:
          type: integer
          format: int64
        remaining:
          type: integer
          format: int64
          nullable: true
        provisioned:
          type: boolean
    QuotaResponse:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/QuotaEntry"
    ProductResource:
      type: object
      properties:
        resource:
          type: string
        unit:
          type: string
        min_amount:
          type: integer
          format: int64
        step_amount:
          type: integer
          format: int64
    Product:
      type: object
      properties:
        name:
          type: string
        default_ttl_seconds:
          type: integer
        max_ttl_seconds:
          type: integer
        resources:
          type: array
          items:
            $ref: "#/components/schemas/ProductResource"
    ListProductsResponse:
      type: object
      properties:
        products:
          type: array
          items:
            $ref: "#/components/schemas/Product"
    RegionsResponse:
      type: object
      properties:
        regions:
          type: array
          items:
            type: object
            properties:
              region:
                type: string
              status:
                type: string
    FanoutAvailabilityResponse:
      type: object
      properties:
        regions:
          type: array
          items:
            type: object
            properties:
              region:
                type: string
              entries:
                type: array
                items:
                  $ref: "#/components/schemas/AvailabilityEntry"
        partial:
          type: boolean
        unavailable_regions:
          type: array
          items:
            type: string
    FanoutQuotaResponse:
      type: object
      properties:
        regions:
          type: array
          items:
            type: object
            properties:
              region:
                type: string
              entries:
                type: array
                items:
                  $ref: "#/components/schemas/QuotaEntry"
        partial:
          type: boolean
        unavailable_regions:
          type: array
          items:
            type: string
    FanoutServicesResponse:
      type: object
      properties:
        regions:
          type: array
          items:
            type: object
            properties:
              region:
                type: string
              services:
                type: array
                items:
                  $ref: "#/components/schemas/Service"
        partial:
          type: boolean
        unavailable_regions:
          type: array
          items:
            type: string
    FanoutProductsResponse:
      type: object
      properties:
        regions:
          type: array
          items:
            type: object
            properties:
              region:
                type: string
              products:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
        partial:
          type: boolean
        unavailable_regions:
          type: array
          items:
            type: string